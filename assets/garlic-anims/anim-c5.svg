<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated gauge: a blood-pressure needle climbing into the amber zone while a warning light blinks" style="width:100%;height:auto;display:block;border-radius:12px;background:#F4EEE6">
<style>text{font-family:Figtree,Arial,sans-serif}</style><path d="M105 262 A135 135 0 0 1 375 262 Z" fill="#fff" stroke="#E2D6CB" stroke-width="4"/><path d="M135.0 250.0 A105 105 0 0 1 204.1 151.3" stroke="#7BB37F" stroke-width="22" fill="none"/><path d="M204.1 151.3 A105 105 0 0 1 292.5 159.1" stroke="#E7B44C" stroke-width="22" fill="none"/><path d="M292.5 159.1 A105 105 0 0 1 345.0 250.0" stroke="#D0574A" stroke-width="22" fill="none"/>
<g transform="translate(240 250)"><line x1="0" y1="0" x2="-88" y2="0" stroke="#2A1E1A" stroke-width="6" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="10;70;118;112;118" keyTimes="0;.4;.7;.85;1" dur="3.5s" repeatCount="indefinite"/></line><circle r="12" fill="#2A1E1A"/></g>
<g transform="translate(420 110)"><circle r="22" fill="#E7B44C"><animate attributeName="opacity" values="1;.25;1" dur="1.1s" repeatCount="indefinite"/></circle><text x="0" y="7" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">!</text></g>
<text x="240" y="310" text-anchor="middle" font-size="16" font-weight="800" fill="#2A1E1A">The number is a warning light</text>
<text x="240" y="332" text-anchor="middle" font-size="13" fill="#7A6A62">It tells you something underneath needs support</text></svg>