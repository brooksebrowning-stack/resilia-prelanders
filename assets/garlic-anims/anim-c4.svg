<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram: a garlic clove deepening from fresh white to dark amber as it ages" style="width:100%;height:auto;display:block;border-radius:12px;background:#F4EEE6">
<style>text{font-family:Figtree,Arial,sans-serif}</style><g transform="translate(110 175)"><path d="M0 -70 C 38 -40, 46 40, 0 70 C -46 40, -38 -40, 0 -70 Z" stroke="#8E6B3A" stroke-width="2"><animate attributeName="fill" values="#F6F1E4;#EFE2BE;#F6F1E4" dur="6s" repeatCount="indefinite"/></path></g><g transform="translate(240 175)"><path d="M0 -70 C 38 -40, 46 40, 0 70 C -46 40, -38 -40, 0 -70 Z" stroke="#8E6B3A" stroke-width="2"><animate attributeName="fill" values="#E8C987;#C98C3A;#E8C987" dur="6s" repeatCount="indefinite"/></path></g><g transform="translate(370 175)"><path d="M0 -70 C 38 -40, 46 40, 0 70 C -46 40, -38 -40, 0 -70 Z" stroke="#8E6B3A" stroke-width="2"><animate attributeName="fill" values="#8A4A1A;#4A2410;#8A4A1A" dur="6s" repeatCount="indefinite"/></path></g>
<text x="80" y="285" font-size="14" font-weight="800" fill="#2A1E1A">Fresh</text><text x="215" y="285" font-size="14" font-weight="800" fill="#2A1E1A">Aging</text><text x="345" y="285" font-size="14" font-weight="800" fill="#2A1E1A">Aged</text>
<text x="60" y="305" font-size="12" fill="#7A6A62">sharp, strong smell</text><text x="345" y="305" font-size="12" fill="#7A6A62">mellow, odorless</text>
<path d="M150 175 L195 175" stroke="#7A6A62" stroke-width="2.5" marker-end="url(#a)"/><path d="M280 175 L325 175" stroke="#7A6A62" stroke-width="2.5" marker-end="url(#a)"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7A6A62"/></marker></defs>
<text x="240" y="50" text-anchor="middle" font-size="16" font-weight="800" fill="#2A1E1A">Aging changes garlic</text></svg>